<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="icon" href="data:,">
<style>
/* The app's own faces, served from the same WebUI folder the page uses, so the door and
   the hall are set in the same type. The colours are the app's iron and bone tokens
   written out, because this page is served before app.css can be. */
@font-face{font-family:'Cinzel';font-style:normal;font-weight:500 700;font-display:swap;src:url('/fonts/Cinzel-latin.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('/fonts/Inter-latin.woff2') format('woff2');}
:root{color-scheme:dark;
  --iron:#1A1D21;--iron-deep:#14161A;--iron-deeper:#0F1114;
  --ember:#FF7A1A;--ember-hi:#FFB35C;
  --bone:#E8E2D5;--bone-dim:#ABA391;--bone-faint:#5E594E;
  --blood-text:#FC6C63;--bronze-hi:rgba(140,109,63,.75);
  --serif:'Cinzel',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,'Segoe UI',sans-serif;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#23272D 0%,var(--iron-deeper) 70%);
  color:var(--bone);font-family:var(--sans);font-size:14px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px}
.door{width:100%;max-width:360px;background:var(--iron);border:1px solid var(--bronze-hi);
  border-radius:8px;padding:32px 28px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:4px;
  text-transform:uppercase;text-align:center;color:var(--bone)}
.lead{margin:0 0 22px;text-align:center;color:var(--bone-dim);font-size:12.5px}
label{display:block;margin:0 0 14px}
label span{display:block;margin-bottom:5px;font-size:11px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--bone-dim)}
input{width:100%;background:var(--iron-deep);color:var(--bone);border:1px solid var(--bone-faint);
  border-radius:4px;padding:9px 11px;font:inherit;outline:none}
input:focus{border-color:var(--ember)}
button{width:100%;margin-top:6px;background:var(--ember);color:var(--iron-deeper);border:0;
  border-radius:4px;padding:10px 12px;font:inherit;font-weight:600;letter-spacing:.5px;cursor:pointer}
button:hover{background:var(--ember-hi)}
.msg{min-height:20px;margin:0 0 12px;text-align:center;color:var(--blood-text);font-size:12.5px}
</style>
</head>
<body>
<main class="door">
  <h1>{{title}}</h1>
  <p class="lead">{{lead}}</p>
  <form method="post" action="/login" autocomplete="off">
    <p class="msg" role="alert">{{message}}</p>
    <label {{setupOnly}}><span>{{tokenLabel}}</span><input type="text" name="token" autocomplete="off" spellcheck="false" {{tokenFocus}}></label>
    <label><span>{{passwordLabel}}</span><input type="password" name="password" autocomplete="current-password" {{passwordFocus}}></label>
    <button type="submit">{{button}}</button>
  </form>
</main>
</body>
</html>
